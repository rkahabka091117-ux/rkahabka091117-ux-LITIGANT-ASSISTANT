workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    environment:
      android_sdk: default
      java: default
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true
